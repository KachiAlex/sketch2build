[project]
name = "sketch2build-ai"
version = "0.1.0"
description = "AI processing services for Sketch2Build"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pillow>=10.4.0",
  "numpy>=1.26.0",
  "shapely>=2.0.0",
  "ezdxf>=1.3.0",
  "reportlab>=4.2.0",
  "celery>=5.4.0",
  "redis>=5.0.0",
  "boto3>=1.34.0",
  "python-multipart>=0.0.9",
  "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
