[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sketch2build-ai"
version = "0.1.0"
description = "AI Architectural Design Engine for Sketch2Build"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "celery>=5.4",
    "redis>=5.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "pillow>=10.3",
    "numpy>=1.26",
    "scipy>=1.13",
    "shapely>=2.0",
    "networkx>=3.3",
    "torch>=2.3",
    "torchvision>=0.18",
    "transformers>=4.41",
    "diffusers>=0.28",
    "accelerate>=0.30",
    "datasets>=2.19",
    "wandb>=0.17",
    "python-json-logger>=2.0",
    "structlog>=24.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "black>=24.4",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
